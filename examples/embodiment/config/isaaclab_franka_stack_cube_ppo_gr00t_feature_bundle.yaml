defaults:
  - env/isaaclab_stack_cube@env.train
  - env/isaaclab_stack_cube@env.eval
  - model/gr00t@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# This config keeps the W85 Stack Cube workload and enables the reviewed W05
# bundle: unused-logits removal plus frozen rollout-backbone feature reuse.
cluster:
  num_nodes: 1
  component_placement:
    env: 0-7
    rollout:
      node_group: "rollout"
      placement: 0-7
    actor: 0-7

  node_groups:
    - label: "rollout"
      node_ranks: all
      env_configs:
        - node_ranks: all
          env_vars:
            - OMP_NUM_THREADS: 32

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "w05_n15_stack_cube_feature_bundle"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: 10
  save_interval: 10
  seq_length: 4096
  max_prompt_length: 30
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 3
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 2
    total_num_envs: 64
    max_episode_steps: 448
    max_steps_per_rollout_epoch: 448
    use_fixed_reset_state_ids: true

  eval:
    rollout_epoch: 3
    total_num_envs: 32
    max_episode_steps: 448
    max_steps_per_rollout_epoch: 448
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: true
    seed: 10000
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: true
  pipeline_stage_num: 1
  pinned_feature_verify_trajectory: false
  pinned_feature_ipc_batch_blocks: 16
  pinned_feature_ipc_timeout_seconds: 300.0

  model:
    model_path: ${oc.env:GR00T_STACK_CUBE_MODEL_PATH}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 512
  seed: 1234
  enable_offload: false

  model:
    model_path: ${oc.env:GR00T_STACK_CUBE_MODEL_PATH}
    add_value_head: true
    embodiment_tag: "isaaclab_franka"
    obs_converter_type: "isaaclab_stack_cube"
    num_action_chunks: 16
    skip_unused_lm_head: true
    rollout_backbone_feature_transport: borrowed_ipc_pinned

  optim:
    lr: 1.0e-5
    value_lr: 2.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
