defaults:
  - env/isaaclab_stack_cube@env.train
  - env/isaaclab_stack_cube@env.eval
  - model/gr00t@actor.model
  # The native evaluation entrypoint has no Actor and therefore constructs
  # the policy from rollout.model directly.  Keep the complete model contract
  # in both namespaces; the overrides below intentionally remain identical.
  - model/gr00t@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env: 0-7
    rollout:
      node_group: rollout
      placement: 0-7
    actor: 0-7
  node_groups:
    - label: rollout
      node_ranks: all
      env_configs:
        - node_ranks: all
          env_vars:
            - OMP_NUM_THREADS: 32
  tracer:
    enable: false

runner:
  task_type: embodied
  logger:
    log_path: ./outputs/w43-stack-cube-newton
    project_name: rlinf
    experiment_name: w43_stack_cube_newton_control
    logger_backends: [tensorboard]
  max_epochs: 25
  max_steps: -1
  only_eval: false
  val_check_interval: 10
  save_interval: 10
  seq_length: 4096
  max_prompt_length: 30
  resume_dir: null
  ckpt_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
  debug_nonfinite: false
  per_worker_log: false
  per_worker_log_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 3
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 2
    total_num_envs: 64
    max_episode_steps: 448
    max_steps_per_rollout_epoch: 448
    auto_reset: false
    use_fixed_reset_state_ids: true
    seed: 0
    init_params:
      id: RLInf-W43-Stack-Cube-Franka-IK-Rel-Visuomotor-Rewarded-v0
      num_envs: null
      max_episode_steps: 448
      task_description: Stack the red block on the blue block, then stack the green block on the red block.
      table_cam:
        height: 256
        width: 256
      wrist_cam:
        height: 256
        width: 256
  eval:
    rollout_epoch: 3
    total_num_envs: 32
    max_episode_steps: 448
    max_steps_per_rollout_epoch: 448
    # One fixed 448-action trajectory per reset.  This yields exactly
    # 32 envs * 3 epochs = 96 episodes and matches the Poiesis W42 r0/r10/r25
    # evaluation boundary.  Training keeps the original W85 auto_reset=false.
    auto_reset: false
    ignore_terminations: true
    use_fixed_reset_state_ids: true
    seed: 42
    init_params:
      id: RLInf-W43-Stack-Cube-Franka-IK-Rel-Visuomotor-Rewarded-v0
      num_envs: null
      max_episode_steps: 448
      task_description: Stack the red block on the blue block, then stack the green block on the red block.
      table_cam:
        height: 256
        width: 256
      wrist_cam:
        height: 256
        width: 256
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  seed: 64101
  model:
    model_path: /models/RLinf-Gr00t-SFT-Stack-cube
    precision: ${actor.model.precision}
    add_value_head: true
    embodiment_tag: isaaclab_franka
    obs_converter_type: isaaclab_stack_cube
    num_action_chunks: 16
    value_head_init_seed: 1234

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 512
  seed: 1234
  enable_offload: false
  model:
    model_path: /models/RLinf-Gr00t-SFT-Stack-cube
    add_value_head: true
    embodiment_tag: isaaclab_franka
    obs_converter_type: isaaclab_stack_cube
    num_action_chunks: 16
    value_head_init_seed: 1234
  optim:
    lr: 1.0e-5
    value_lr: 2.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
