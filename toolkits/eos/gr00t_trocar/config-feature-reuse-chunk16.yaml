cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
  tracer:
    enable: false
runner:
  task_type: embodied
  logger:
    log_path: ./outputs/w73-trocar-baseline
    project_name: rlinf
    experiment_name: w73_newton_chunk16_baseline
    logger_backends:
    - tensorboard
  max_epochs: 100000
  max_steps: -1
  only_eval: false
  eval_policy_path: null
  val_check_interval: 5
  save_interval: 5
  seq_length: 4096
  max_prompt_length: 30
  resume_dir: null
  debug_nonfinite: false
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 8
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: action_level
  entropy_type: chunk_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
env:
  group_name: EnvGroup
  channel:
    name: env_buffer_list
    queue_name: obs_buffer
    queue_size: 0
  enable_offload: false
  train:
    env_type: isaaclab
    total_num_envs: 64
    auto_reset: false
    ignore_terminations: false
    use_rel_reward: true
    seed: 64201
    group_size: 1
    reward_coef: 1.0
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 128
    max_episode_steps: 256
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ./outputs/w73-trocar-baseline/video/train
    init_params:
      id: W68-Assemble-Trocar-G129-Dex3-Newton-v0
      num_envs: null
      max_episode_steps: 256
      task_description: assemble trocar from tray
    isaaclab:
      task_description: assemble trocar from tray
      main_images: front_camera
      extra_view_images:
      - left_wrist_camera
      - right_wrist_camera
      states:
      - key: robot_joint_state
        slice:
        - 15
        - 29
      - key: robot_dex3_joint_state
      gr00t_mapping:
        video:
          main_images: video.room_view
          extra_view_images:
          - video.left_wrist_view
          - video.right_wrist_view
        state:
        - gr00t_key: state.left_arm
          slice:
          - 0
          - 7
        - gr00t_key: state.right_arm
          slice:
          - 7
          - 14
        - gr00t_key: state.left_hand
          slice:
          - 14
          - 21
        - gr00t_key: state.right_hand
          slice:
          - 21
          - 28
      action_mapping:
        prefix_pad: 15
        suffix_pad: 0
      obs_converter_type: dex3
      embodiment_tag: new_embodiment
      embodiment_tag_id: 31
      data_config_class: gr00t_config:IsaacLabDataConfig
    rollout_epoch: 8
  eval:
    env_type: isaaclab
    total_num_envs: 8
    auto_reset: true
    ignore_terminations: true
    use_rel_reward: true
    seed: 0
    group_size: 1
    reward_coef: 1.0
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 256
    max_episode_steps: 256
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: ./outputs/w73-trocar-baseline/video/eval
    init_params:
      id: W68-Assemble-Trocar-G129-Dex3-Newton-v0
      num_envs: null
      max_episode_steps: 256
      task_description: install trocar from box
    isaaclab:
      task_description: assemble trocar from tray
      main_images: front_camera
      extra_view_images:
      - left_wrist_camera
      - right_wrist_camera
      states:
      - key: robot_joint_state
        slice:
        - 15
        - 29
      - key: robot_dex3_joint_state
      gr00t_mapping:
        video:
          main_images: video.room_view
          extra_view_images:
          - video.left_wrist_view
          - video.right_wrist_view
        state:
        - gr00t_key: state.left_arm
          slice:
          - 0
          - 7
        - gr00t_key: state.right_arm
          slice:
          - 7
          - 14
        - gr00t_key: state.left_hand
          slice:
          - 14
          - 21
        - gr00t_key: state.right_hand
          slice:
          - 21
          - 28
      action_mapping:
        prefix_pad: 15
        suffix_pad: 0
      obs_converter_type: dex3
      embodiment_tag: new_embodiment
      embodiment_tag_id: 31
      data_config_class: gr00t_config:IsaacLabDataConfig
    rollout_epoch: 1
rollout:
  seed: 64101
  group_name: RolloutGroup
  channel:
    name: env_buffer_list
    queue_name: action_buffer
    queue_size: 0
  mode: colocate
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  pinned_feature_ipc_batch_blocks: 16
  pinned_feature_ipc_timeout_seconds: 300.0
  pinned_feature_verify_trajectory: false
  model:
    model_path: /models/Assemble_Trocar
    precision: bf16
    obs_converter_type: dex3
    embodiment_tag: new_embodiment
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
    max_new_tokens: null
actor:
  group_name: ActorGroup
  channel:
    name: env_buffer_list
    queue_name: replay_buffer
    queue_size: 0
  training_backend: fsdp
  micro_batch_size: 128
  global_batch_size: 2048
  seed: 64001
  enable_offload: false
  model:
    model_type: gr00t
    skip_unused_lm_head: true
    rollout_backbone_feature_transport: borrowed_ipc_pinned
    model_path: /models/Assemble_Trocar
    precision: bf16
    trust_remote_code: true
    is_lora: false
    action_dim: 28
    num_action_chunks: 16
    denoising_steps: 4
    policy_setup: widowx_bridge
    obs_converter_type: dex3
    embodiment_tag: new_embodiment
    add_value_head: true
    value_head_init_seed: 64001
    rl_head_config:
      joint_logprob: false
      noise_method: flow_sde
      ignore_last: false
      safe_get_logprob: false
      noise_anneal: false
      noise_params:
      - 0.7
      - 0.3
      - 400
      noise_level: 0.3
      add_value_head: true
      chunk_critic_input: false
      detach_critic_input: true
      disable_dropout: true
      use_vlm_value: false
      value_vlm_mode: mean_token
      padding_value: 850
  optim:
    lr: 2.0e-05
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    fsdp_size: -1
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp:
      enabled: false
      precision: bf16
      use_grad_scaler: false
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
reward:
  use_reward_model: false
critic:
  use_critic_model: false
